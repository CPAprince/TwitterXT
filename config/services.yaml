# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

parameters:
    cache_ttl_feed_main: '%env(int:CACHE_TTL_FEED_MAIN)%'
    cache_ttl_feed_user: '%env(int:CACHE_TTL_FEED_USER)%'
    cache_ttl_profile: '%env(int:CACHE_TTL_PROFILE)%'
    like_toggle_lock_ttl_seconds: '%env(int:LIKE_TOGGLE_LOCK_TTL)%'

services:
    _defaults:
        autowire: true
        autoconfigure: true
        
    Redis:
        class: Redis
        public: true
        calls:
            -   connect:
                    - '%env(REDIS_HOST)%'
                    - '%env(int:REDIS_PORT)%'

    Twitter\Shared\Infrastructure\EventSubscriber\ExceptionSubscriber:
        tags: [ 'kernel.event_subscriber' ]
        arguments:
            $environment: '%kernel.environment%'

    Twitter\Shared\Infrastructure\EventSubscriber\DoctrineResetSubscriber:
        tags: [ 'kernel.event_subscriber' ]

    Twitter\Shared\Infrastructure\RateLimiter\RateLimitSubscriber:
        tags: [ 'kernel.event_subscriber' ]

    Twitter\Shared\Infrastructure\EventSubscriber\JWTCreatedListener:
        tags:
            - { name: kernel.event_listener, event: lexik_jwt_authentication.on_jwt_created }

    Twitter\IAM\UI\REST\Controller\:
        resource: '../src/IAM/UI/REST/Controller/*Controller.php'
        tags: [ 'controller.service_arguments' ]
    
    Twitter\IAM\UI\Web\:
        resource: '../src/IAM/UI/Web/*/*Controller.php'
        tags: [ 'controller.service_arguments' ]

    Twitter\Registration\UI\REST\Controller\:
        resource: '../src/Registration/UI/REST/Controller/*Controller.php'
        tags: [ 'controller.service_arguments' ]

    Twitter\IAM\Application\CreateUser\CreateUserCommandHandler:
        arguments:
            $userRepository: '@Twitter\IAM\Domain\User\Model\UserRepository'

    Twitter\Registration\Application\UseCase\RegisterUser\RegisterUserCommandHandler:
        arguments:
            $entityManager: '@doctrine.orm.entity_manager'
            $messageBus: '@messenger.default_bus'

    Twitter\Registration\Application\Message\SendWelcomeEmailHandler:
        arguments:
            $senderAddress: '%env(MAILER_SENDER)%'
            $appBaseUrl: '%env(DEFAULT_URI)%'

    Twitter\IAM\Application\Logout\LogoutHandler:
        arguments:
            $repository: '@Twitter\IAM\Application\Logout\RefreshTokenRepository'

    Twitter\IAM\Infrastructure\Auth\RefreshTokenHasher:
        arguments:
            $secret: '%env(APP_SECRET)%'

    Twitter\IAM\Domain\User\Model\UserRepository:
        class: Twitter\IAM\Infrastructure\Persistence\MySQL\Repository\MySQLUserRepository
        tags: [ 'doctrine.repository_service' ]

    Twitter\IAM\Application\Logout\RefreshTokenRepository:
        class: Twitter\IAM\Infrastructure\Persistence\MySQL\Repository\MySQLRefreshTokenRepository

    Twitter\Profile\UI\REST\Controller\:
        resource: '../src/Profile/UI/REST/Controller/*/*Controller.php'
        tags: [ 'controller.service_arguments' ]

    Twitter\Profile\UI\Web\:
        resource: '../src/Profile/UI/Web/*/*Controller.php'
        tags: [ 'controller.service_arguments' ]

    Twitter\Like\UI\REST\Controller\:
        resource: '../src/Like/UI/REST/Controller/*Controller.php'
        tags: [ 'controller.service_arguments' ]

    Twitter\Profile\Application\UseCase\CreateProfile\CreateProfileCommandHandler:
        arguments:
            $profileRepository: '@Twitter\Profile\Domain\Profile\Model\ProfileRepository'
    
    Twitter\Like\Application\UseCase\ToggleLike\ToggleLikeCommandHandler:
        arguments:
            $likeRepository: '@Twitter\Like\Domain\Like\Model\LikeRepository'
            
    Twitter\Like\Application\UseCase\ToggleLike\ToggleLikeCommandHandlerInterface: '@Twitter\Like\Application\UseCase\ToggleLike\ToggleLikeCommandHandler'
    
    Twitter\Like\Infrastructure\Lock\Decorator\ToggleLikeCommandHandlerDecorator:
        decorates: Twitter\Like\Application\UseCase\ToggleLike\ToggleLikeCommandHandlerInterface
        arguments:
            $inner: '@.inner'
            $ttlSeconds: '%like_toggle_lock_ttl_seconds%'
    
    Twitter\Profile\Application\UseCase\GetProfile\GetProfileQueryHandler:
        arguments:
            $profileRepository: '@Twitter\Profile\Domain\Profile\Model\ProfileRepository'

    Twitter\Profile\Application\UseCase\GetProfile\GetProfileQueryHandlerInterface: '@Twitter\Profile\Application\UseCase\GetProfile\GetProfileQueryHandler'

    Twitter\Profile\Application\UseCase\UpdateProfile\UpdateProfileCommandHandler:
        arguments:
            $profileRepository: '@Twitter\Profile\Domain\Profile\Model\ProfileRepository'

    Twitter\Profile\Application\UseCase\UpdateProfile\UpdateProfileCommandHandlerInterface: '@Twitter\Profile\Application\UseCase\UpdateProfile\UpdateProfileCommandHandler'

    Twitter\Profile\Domain\Profile\Model\ProfileRepository:
        class: Twitter\Profile\Infrastructure\Persistence\MySQL\Repository\MySQLProfileRepository

    Twitter\Tweet\UI\REST\:
        resource: '../src/Tweet/UI/REST/*/*Controller.php'
        tags: [ 'controller.service_arguments' ]

    Twitter\Tweet\Domain\Tweet\Model\TweetRepository:
        class: Twitter\Tweet\Infrastructure\Persistence\MySQL\Repository\MySQLTweetRepository

    Twitter\Tweet\Application\UseCase\CreateTweet\CreateTweetCommandHandler:
        arguments:
            $tweetRepository: '@Twitter\Tweet\Domain\Tweet\Model\TweetRepository'

    Twitter\Tweet\Application\UseCase\CreateTweet\CreateTweetCommandHandlerInterface: '@Twitter\Tweet\Application\UseCase\CreateTweet\CreateTweetCommandHandler'
    
    Twitter\Like\Domain\Like\Model\LikeRepository:
        class: Twitter\Like\Infrastructure\Persistence\MySQL\Repository\MySQLLikeRepository

    Twitter\Tweet\UI\Web\:
        resource: '../src/Tweet/UI/Web/'
        tags: [ 'controller.service_arguments' ]
    
    Twitter\Tweet\Application\UseCase\GetTweet\GetTweetCommandHandler:
        arguments:
            $tweetRepository: '@Twitter\Tweet\Domain\Tweet\Model\TweetRepository'
            $profileRepository: '@Twitter\Profile\Domain\Profile\Model\ProfileRepository'
    
    Twitter\Tweet\Application\UseCase\GetTweets\GetTweetsCommandHandler:
        arguments:
            $tweetRepository: '@Twitter\Tweet\Domain\Tweet\Model\TweetRepository'
            $profileRepository: '@Twitter\Profile\Domain\Profile\Model\ProfileRepository'

    Twitter\Tweet\Application\UseCase\GetTweets\GetTweetsCommandHandlerInterface: '@Twitter\Tweet\Application\UseCase\GetTweets\GetTweetsCommandHandler'

    Twitter\Tweet\Application\UseCase\UpdateTweet\UpdateTweetCommandHandler:
        arguments:
            $tweetRepository: '@Twitter\Tweet\Domain\Tweet\Model\TweetRepository'
    
    Twitter\Tweet\Application\UseCase\UpdateTweet\UpdateTweetCommandHandlerInterface: '@Twitter\Tweet\Application\UseCase\UpdateTweet\UpdateTweetCommandHandler'

    Twitter\Tweet\Application\UseCase\GetUserTweets\GetUserTweetsQueryHandler:
        arguments:
            $tweetRepository: '@Twitter\Tweet\Domain\Tweet\Model\TweetRepository'

    Twitter\Tweet\Application\EventSubscriber\LikeMessageBridgeSubscriber:
        tags: [ 'kernel.event_subscriber' ]
    
    Twitter\Tweet\Application\UseCase\GetUserTweets\GetUserTweetsQueryHandlerInterface: '@Twitter\Tweet\Application\UseCase\GetUserTweets\GetUserTweetsQueryHandler'

    Twitter\Tweet\Infrastructure\Cache\Proxy\GetTweetsCommandHandlerProxy:
        decorates: Twitter\Tweet\Application\UseCase\GetTweets\GetTweetsCommandHandlerInterface
        arguments:
            $inner: '@.inner'
            $cacheTweets: '@cache.tweets'
            $ttl: '%cache_ttl_feed_main%'

    Twitter\Tweet\Infrastructure\Cache\Proxy\GetUserTweetsQueryHandlerProxy:
        decorates: Twitter\Tweet\Application\UseCase\GetUserTweets\GetUserTweetsQueryHandlerInterface
        arguments:
            $inner: '@.inner'
            $cacheTweets: '@cache.tweets'
            $ttl: '%cache_ttl_feed_user%'

    Twitter\Tweet\Infrastructure\Cache\Decorator\UpdateTweetCommandHandlerDecorator:
        decorates: Twitter\Tweet\Application\UseCase\UpdateTweet\UpdateTweetCommandHandlerInterface
        arguments:
            $inner: '@.inner'
            $cacheTweets: '@cache.tweets'

    Twitter\Tweet\Infrastructure\Cache\Decorator\CreateTweetCommandHandlerDecorator:
        decorates: Twitter\Tweet\Application\UseCase\CreateTweet\CreateTweetCommandHandlerInterface
        arguments:
            $inner: '@.inner'
            $cacheTweets: '@cache.tweets'

    Twitter\Profile\Infrastructure\Cache\Proxy\GetProfileQueryHandlerProxy:
        decorates: Twitter\Profile\Application\UseCase\GetProfile\GetProfileQueryHandlerInterface
        arguments:
            $inner: '@.inner'
            $cacheProfiles: '@cache.profiles'
            $ttl: '%cache_ttl_profile%'

    Twitter\Profile\Infrastructure\Cache\Decorator\UpdateProfileCommandHandlerDecorator:
        decorates: Twitter\Profile\Application\UseCase\UpdateProfile\UpdateProfileCommandHandlerInterface
        arguments:
            $inner: '@.inner'
            $cacheProfiles: '@cache.profiles'

    Twitter\Tweet\Application\Message\UpdateTweetLikesCountHandler: ~

    Twitter\Tweet\Infrastructure\Service\TweetLikesCountUpdaterInterface:
        class: Twitter\Tweet\Infrastructure\Service\TweetLikesCountUpdater

    Twitter\Tweet\Infrastructure\Service\LikeBroadcasterInterface:
        class: Twitter\Tweet\Infrastructure\Service\LikeBroadcaster
        arguments:
            $hub: '@Symfony\Component\Mercure\HubInterface'
            $topicBaseUrl: '%env(DEFAULT_URI)%'
            $logger: '@logger'

    Twitter\Metrics\Controller\:
        resource: '../src/Metrics/Controller'
        tags: [ 'controller.service_arguments' ]
    
    Twitter\Metrics\EventSubscriber\HttpMetricsSubscriber:
        tags:
            - { name: kernel.event_subscriber }
    
    Prometheus\Storage\InMemory:
        public: true
    
    Prometheus\CollectorRegistry:
        class: Prometheus\CollectorRegistry
        arguments:
            - '@Prometheus\Storage\InMemory'

    Twitter\Tweet\Application\Moderation\:
        resource: '../src/Tweet/Application/Moderation/'
        exclude:
            - '../src/Tweet/Application/Moderation/ModerationConfig.php'
            - '../src/Tweet/Application/Moderation/ModerationMode.php'
            - '../src/Tweet/Application/Moderation/ModerationBatch.php'
            - '../src/Tweet/Application/Moderation/ModerationBatchItem.php'
            - '../src/Tweet/Application/Moderation/ModerationDecision.php'
            - '../src/Tweet/Application/Moderation/ModerationRateLimitResult.php'
            - '../src/Tweet/Application/Moderation/ModerationTweetCandidate.php'
            - '../src/Tweet/Application/Moderation/TokenBucketDecision.php'

    Twitter\Tweet\Infrastructure\Moderation\:
        resource: '../src/Tweet/Infrastructure/Moderation/'
        exclude:
            - '../src/Tweet/Infrastructure/Moderation/ModerationConfigFactory.php'

    Twitter\Tweet\Infrastructure\Moderation\ModerationConfigFactory:
        public: true
        arguments:
            $enabled: '%moderation.enabled%'
            $mode: '%moderation.mode%'
            $provider: '%moderation.provider%'
            $model: '%moderation.model%'
            $apiKey: '%moderation.api_key%'

            $batchMaxItems: '%moderation.batch.max_items%'
            $batchSoftTokenCap: '%moderation.batch.soft_token_cap%'
            $batchHardTokenCap: '%moderation.batch.hard_token_cap%'
            $batchFlushIntervalMs: '%moderation.batch.flush_interval_ms%'

            $limitRpm: '%moderation.limits.rpm%'
            $limitTpm: '%moderation.limits.tpm%'
            $limitRpd: '%moderation.limits.rpd%'

            $demoApprovePercent: '%moderation.demo.approve_percent%'

            $redisQueueKey: '%moderation.redis.queue_key%'
            $redisFlushLockKey: '%moderation.redis.flush_lock_key%'
            $redisRateReqPrefix: '%moderation.redis.rate_req_prefix%'
            $redisRateTokPrefix: '%moderation.redis.rate_tok_prefix%'
            $redisRateReqDayPrefix: '%moderation.redis.rate_req_day_prefix%'

            $workerIdleSleepMs: '%moderation.worker.idle_sleep_ms%'
            $workerLockTtlSeconds: '%moderation.worker.lock_ttl_seconds%'
            $workerMaxFetchItems: '%moderation.worker.max_fetch_items%'

    Twitter\Tweet\Application\Moderation\ModerationConfig:
        public: true
        factory: [ '@Twitter\Tweet\Infrastructure\Moderation\ModerationConfigFactory', 'create' ]

    Twitter\Tweet\Application\Moderation\TweetModerationProviderInterface:
        public: true
        factory: [ '@Twitter\Tweet\Infrastructure\Moderation\TweetModerationProviderResolver', 'resolve' ]

    Twitter\Tweet\Application\Moderation\ModerationQueueInterface:
        alias: Twitter\Tweet\Infrastructure\Moderation\RedisModerationQueue
        public: true

    Twitter\Tweet\Application\Moderation\ModerationTweetSourceInterface:
        alias: Twitter\Tweet\Infrastructure\Moderation\MySqlModerationTweetSource
        public: true

    Twitter\Tweet\Application\Moderation\ModerationStatusUpdaterInterface:
        alias: Twitter\Tweet\Infrastructure\Moderation\MySqlModerationStatusUpdater
        public: true

    Twitter\Tweet\Application\Moderation\ModerationRateLimiterInterface:
        alias: Twitter\Tweet\Infrastructure\Moderation\RedisModerationRateLimiter
        public: true

    Twitter\Tweet\Application\Moderation\ModerationWorkerLockInterface:
        alias: Twitter\Tweet\Infrastructure\Moderation\RedisModerationWorkerLock
        public: true

    Twitter\Tweet\UI\CLI\TestModerationProviderCommand:
        tags: [ 'console.command' ]

    Twitter\Tweet\UI\CLI\ModerationFlushWorkerCommand:
        tags: [ 'console.command' ]
        public: true

    
    app.login_rate_limiter:
        class: Symfony\Component\Security\Http\RateLimiter\DefaultLoginRateLimiter
        arguments:
            $globalFactory: '@limiter.ip_login'
            $localFactory: '@limiter.username_ip_login'
            $secret: '%kernel.secret%'

    # DoctrineClearSubscriber commented out: redundant with DoctrineResetSubscriber.
    # In FrankenPHP worker mode, resetManager() already clears the identity map; this subscriber's
    # injected EM reference becomes stale after reset, making it redundant at best.
    # Twitter\Shared\Infrastructure\EventSubscriber\DoctrineClearSubscriber:
    #     tags: [ 'kernel.event_subscriber' ]
