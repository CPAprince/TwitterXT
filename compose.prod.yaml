services:
  php:
    build:
      context: .
      target: frankenphp_prod
    environment:
      APP_ENV: prod
      APP_DEBUG: 0
      APP_SECRET: ${APP_SECRET}

  php-worker:
    build:
      context: .
      target: frankenphp_prod
    environment:
      APP_ENV: prod
      APP_DEBUG: 0

  database:
    environment:
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
